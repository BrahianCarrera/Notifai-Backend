version: '3.8'

services:
  # Base de datos PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: notifai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: notifai_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: notifai_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    networks:
      - notifai-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notifai_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Aplicación backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: notifai-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: notifai_db
      DB_USER: postgres
      DB_PASSWORD: notifai_password
      SESSION_SECRET: notifai_super_secret_session_key_2024
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX_REQUESTS: 100
    ports:
      - "3000:3000"
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - notifai-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Adminer para gestión de base de datos (opcional)
  adminer:
    image: adminer:4.8.1
    container_name: notifai-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres
    networks:
      - notifai-network

volumes:
  postgres_data:
    driver: local

networks:
  notifai-network:
    driver: bridge